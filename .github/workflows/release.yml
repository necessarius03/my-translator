name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for a build-only dry run: compiles and packages all three
  # platforms without tagging and without publishing anything (the release job
  # below is gated on a tag). Use it to verify a change builds everywhere
  # before spending a version number on it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      # Retried because bundle_dmg.sh is flaky on hosted runners. Observed on
      # run 36960881924: the Intel job failed inside bundle_dmg.sh after the
      # Rust build AND the .app bundle had both already succeeded, then passed
      # on a rerun of the identical commit with nothing changed. Tauri discards
      # the script's stderr, so there is nothing to diagnose from the log.
      #
      # This matters because the release job `needs` all three builds: without a
      # retry, a coin flip on one of them loses the whole release and the tag
      # has to be deleted and re-pushed.
      #
      # A retry is cheap — cargo's output is already up to date within the job,
      # so a second attempt goes almost straight back to bundling. A volume left
      # mounted by the failed attempt would poison the retry, so detach first.
      - name: Build Tauri app (unsigned)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          for attempt in 1 2 3; do
            hdiutil detach "/Volumes/MyTranslator" -force >/dev/null 2>&1 || true
            if npm run tauri build; then exit 0; fi
            echo "::warning::tauri build failed on attempt ${attempt}/3"
            sleep 10
          done
          exit 1

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg

  build-macos-intel:
    runs-on: macos-14  # Cross-compile to Intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      # Retried for the same reason as the Apple Silicon job above — this is
      # the one that actually flaked.
      - name: Build Tauri app (Intel, unsigned)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          for attempt in 1 2 3; do
            hdiutil detach "/Volumes/MyTranslator" -force >/dev/null 2>&1 || true
            if npm run tauri build -- --target x86_64-apple-darwin; then exit 0; fi
            echo "::warning::tauri build failed on attempt ${attempt}/3"
            sleep 10
          done
          exit 1

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-build
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      # No DMG here, so this job has not flaked — but the release still needs
      # all three, so a transient NSIS/WiX hiccup would cost the same release.
      # `shell: bash` is Git Bash, which the Windows runner ships.
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          for attempt in 1 2 3; do
            if npm run tauri build; then exit 0; fi
            echo "::warning::tauri build failed on attempt ${attempt}/3"
            sleep 10
          done
          exit 1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  release:
    needs: [build-macos, build-macos-intel, build-windows]
    # Tag pushes only. A workflow_dispatch run has no tag, so it stops after the
    # three builds — it is a compile check, never a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-build
          path: artifacts/macos-intel

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Rename macOS artifacts to include arch
        run: |
          # Rename aarch64 tar.gz to include arch
          for f in artifacts/macos/macos/*.app.tar.gz; do
            [ -f "$f" ] && mv "$f" "${f%.app.tar.gz}_aarch64.app.tar.gz"
          done
          for f in artifacts/macos/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && mv "$f" "${f%.app.tar.gz.sig}_aarch64.app.tar.gz.sig"
          done
          # Rename x86_64 tar.gz to include arch
          for f in artifacts/macos-intel/macos/*.app.tar.gz; do
            [ -f "$f" ] && mv "$f" "${f%.app.tar.gz}_x64.app.tar.gz"
          done
          for f in artifacts/macos-intel/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && mv "$f" "${f%.app.tar.gz.sig}_x64.app.tar.gz.sig"
          done
          echo "Renamed artifacts:"
          find artifacts -name "*.tar.gz*" -type f

      - name: Generate latest.json for updater
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signatures
          DARWIN_AARCH64_SIG=$(cat artifacts/macos/macos/*_aarch64.app.tar.gz.sig 2>/dev/null || echo "")
          DARWIN_X86_64_SIG=$(cat artifacts/macos-intel/macos/*_x64.app.tar.gz.sig 2>/dev/null || echo "")
          WINDOWS_X86_64_SIG=$(cat artifacts/windows/nsis/*.exe.sig 2>/dev/null || echo "")

          REPO="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          # Find actual filenames
          DARWIN_AARCH64_FILE=$(ls artifacts/macos/macos/*_aarch64.app.tar.gz 2>/dev/null | head -1 | xargs basename || echo "")
          DARWIN_X86_64_FILE=$(ls artifacts/macos-intel/macos/*_x64.app.tar.gz 2>/dev/null | head -1 | xargs basename || echo "")
          WINDOWS_X86_64_FILE=$(ls artifacts/windows/nsis/*.exe 2>/dev/null | head -1 | xargs basename || echo "")

          cat > artifacts/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes at https://github.com/${{ github.repository }}/releases/tag/v${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${DARWIN_AARCH64_SIG}",
                "url": "${REPO}/${DARWIN_AARCH64_FILE}"
              },
              "darwin-x86_64": {
                "signature": "${DARWIN_X86_64_SIG}",
                "url": "${REPO}/${DARWIN_X86_64_FILE}"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_X86_64_SIG}",
                "url": "${REPO}/${WINDOWS_X86_64_FILE}"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Extract release notes from changelog
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG="docs/project-changelog.md"
          OUT="release-notes.md"

          # Extract section between "## v${VERSION}" and the next "## v" heading
          awk -v tag="## v${VERSION}" '
            $0 ~ "^" tag " " || $0 ~ "^" tag "$" { flag=1; next }
            /^## v/ { flag=0 }
            flag { print }
          ' "$CHANGELOG" > "$OUT"

          # Fallback if section is empty (missing entry)
          if [ ! -s "$OUT" ]; then
            echo "Release v${VERSION}" > "$OUT"
            echo "" >> "$OUT"
            echo "See commits: https://github.com/${{ github.repository }}/compare/...v${VERSION}" >> "$OUT"
          fi

          # Append auto-generated full changelog link
          echo "" >> "$OUT"
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/...v${VERSION}" >> "$OUT"

          echo "--- Release notes preview ---"
          cat "$OUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            artifacts/latest.json
